name: astrbot_plugin_deepseek_search
display_name: DeepSeek 原生联网搜索
short_desc: 让 DeepSeek 模型用官方 web_search 联网查最新信息
desc: |
  为 DeepSeek 聊天模型注册官方内置的联网搜索工具 `deepseek_web_search`。

  当你的机器人需要查询最新信息时，会自动调用该工具，通过 DeepSeek 官方 `/responses` 接口的内置 `web_search` 能力联网搜索，并把结果和来源链接交还给机器人整理成回复。

  无需再让机器人自己写代码爬网页。

  使用前需要在插件配置中填入 DeepSeek API Key（platform.deepseek.com 创建，以 sk- 开头），并确认聊天模型为 deepseek-v4-flash 或 deepseek-v4-pro（两者均支持官方联网搜索）。

  注意：联网搜索会额外消耗 token。
